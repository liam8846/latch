[package]
name = "latch"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "bevy_camera", "bevy_color", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_render", "bevy_core_pipeline", "bevy_light", "bevy_pbr", "bevy_window", "tonemapping_luts", "webgpu", "png", "jpeg", "keyboard", "mouse", "zstd_rust"] }

fluent-bundle = "=0.16.0"
unic-langid = "=0.9.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlCanvasElement", "Event", "EventTarget", "KeyboardEvent", "ErrorEvent", "NodeList", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode", "OscillatorNode", "OscillatorType", "BaseAudioContext", "console"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
